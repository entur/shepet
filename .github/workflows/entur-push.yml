name: Build and push
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  maven-verify:
    env:
      JFROG_USER: ${{ secrets.ARTIFACTORY_AUTH_USER }}
      JFROG_PASS: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
      AUTOSYS_API_APIKEY: ${{ secrets.AUTOSYS_API_APIKEY }}

    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-

      - name: Debug environment variable
        run: |
          if [ -z "$AUTOSYS_API_APIKEY" ]; then
            echo "AUTOSYS_API_APIKEY is not set"
          else
            echo "AUTOSYS_API_APIKEY is set (length: ${#AUTOSYS_API_APIKEY})"
          fi
      - name: Run maven build
        run: mvn -q verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: shepet-app/target/*.jar

  docker-lint:
    needs: [maven-verify]
    uses: entur/gha-docker/.github/workflows/lint.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0
    with:
      ignore: "DL3018"

  docker-build:
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    needs: [maven-verify]
    uses: entur/gha-docker/.github/workflows/build.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    needs: [docker-build]
    uses: entur/gha-docker/.github/workflows/push.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  docker-scan:
    needs: [ docker-build ]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  trigger-deploy:
    if: github.event_name == 'push'
    needs: [docker-push]
    uses: ./.github/workflows/trigger-deployment.yml
    with:
      image_tag: ${{ needs.docker-push.outputs.image_tag }}
    secrets:
      deployment_token: ${{ secrets.SHEPET_DEPLOYMENT_CONFIG_TOKEN }}